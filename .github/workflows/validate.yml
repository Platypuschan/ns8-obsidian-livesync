name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check catalog version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            .github/scripts/check-catalog-version --base "origin/$BASE_REF"
          elif [[ "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            .github/scripts/check-catalog-version --base "origin/$DEFAULT_BRANCH"
          else
            .github/scripts/check-catalog-version
          fi

      - name: Validate Python and JSON
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import ast
          import json
          from pathlib import Path

          errors = []
          ignored = {".git", ".devcontainer", "node_modules", "dist"}

          for path in Path(".").rglob("*"):
              if not path.is_file() or ignored.intersection(path.parts):
                  continue
              try:
                  source = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              first_line = source.partition("\n")[0]
              if first_line.startswith("#!") and "python" in first_line:
                  try:
                      ast.parse(source, filename=str(path))
                  except SyntaxError as exc:
                      errors.append(f"{path}: {exc}")

          for path in Path(".").rglob("*.json"):
              if ignored.intersection(path.parts):
                  continue
              try:
                  with path.open(encoding="utf-8") as stream:
                      json.load(stream)
              except (OSError, json.JSONDecodeError) as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          PY

      - name: Validate shell scripts and systemd state paths
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            if head -n 1 "$file" | grep -Eq '^#!.*(bash|/sh)([[:space:]]|$)'; then
              bash -n "$file"
            fi
          done < <(find . -type f \
            -not -path './.git/*' \
            -not -path './ui/node_modules/*' \
            -print0)

          if grep -R --line-number --fixed-string '%S/state' imageroot; then
            echo "Legacy %S systemd state path found; use %E on current NS8 systems." >&2
            exit 1
          fi

      - name: Install the libraries of the NS8 agent environment used by the tests
        run: python3 -m pip install --user --break-system-packages PyYAML==6.0.3 ldap3==2.9.1

      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  ui:
    name: UI lint, build and browser regressions
    runs-on: ubuntu-latest
    env:
      IBM_TELEMETRY_DISABLED: "true"
      NS8_CORE_IMAGE: ghcr.io/nethserver/core:latest@sha256:91f910e7e247d5806ce63abc54914edd59558b0bd7669a2337b678c295f3b5c6
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Keep in sync with NODE_IMAGE in build-images.sh and ui/Containerfile
          node-version: "24.22.2"

      - name: Immutable production bootstrap, lint and build
        run: ./build-ui.sh
        working-directory: ui

      - name: Enable project-pinned interactive Yarn
        run: npm install --global --force "@yarnpkg/cli-dist@$(node -p 'require("./ui/package.json").packageManager.split("@")[1]')"

      - name: Stack contracts
        run: yarn test:stack
        working-directory: ui

      - name: Extract production NS8 host CSS without execution
        run: .github/scripts/extract-core-css "$RUNNER_TEMP/ns8-core.css"

      - name: Install pinned Playwright browser
        run: yarn playwright install --with-deps chromium
        working-directory: ui

      - name: Production browser regressions with real host CSS
        run: NS8_CORE_CSS="$RUNNER_TEMP/ns8-core.css" yarn test:e2e
        working-directory: ui

      - name: Development bundle diagnostics and browser regressions
        run: NS8_CORE_CSS="$RUNNER_TEMP/ns8-core.css" yarn test:e2e:dev
        working-directory: ui

      - name: Exact production Node image bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          image="$(python3 -c 'import re; print(re.search(r"NODE_IMAGE=\"([^\"]+)\"", open("build-images.sh").read())[1])')"
          podman run --rm -e IBM_TELEMETRY_DISABLED=true -v "$PWD:/src:Z" -w /src/ui "$image" ./build-ui.sh

      - name: Developer image build
        run: podman build --no-cache -t localhost/livesync-ui-dev:ci -f ui/Containerfile ui

      - name: Actual nonroot dev build, watch and interactive serve
        run: .github/scripts/test-ui-dev localhost/livesync-ui-dev:ci
