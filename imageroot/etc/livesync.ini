; CouchDB settings required by the Self-hosted LiveSync plugin for Obsidian.
; They are the settings that utils/couchdb/provision.ts of
; vrtmrz/obsidian-livesync (commit 66bd811) applies through the config API.
; This file is mounted read-only into default.d; runtime changes made in
; Fauxton go to local.d/docker.ini and take precedence.

[couchdb]
; With [cluster] n = 1 this does what _cluster_setup enable_single_node does:
; _users and _replicator are created on first start.
single_node = true
max_document_size = 50000000

[cluster]
n = 1

[chttpd]
require_valid_user = true
max_http_request_size = 4294967296
enable_cors = true

[chttpd_auth]
require_valid_user = true

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
