#
# Obsidian LiveSync state/backup include patterns for Restic
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
# Restic --files-from: https://restic.readthedocs.io/en/stable/040_backup.html#including-files
# Only lines starting with "state/" or "volumes/" are considered by NS8.
#

# Credentials of the CouchDB administrator and the sync accounts.
state/couchdb.env
state/accounts.json

# CouchDB writes its database files append-only, so a copy of the running
# server can be restored (https://docs.couchdb.org/en/stable/maintenance/backups.html).
volumes/couchdb-data
# Runtime configuration: hashed admin password, server UUID and cookie secret.
volumes/couchdb-etc
